name: Deploy Vue app to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      # Project sites are served from https://<user>.github.io/<repo>/,
      # so Vite needs the repo name as its base path.
      # For a <user>.github.io repo or a custom domain, use --base=/ instead.
      - name: Build
        run: npm run build -- --base=/${{ github.event.repository.name }}/

      # SPA fallback so Vue Router history mode works on refresh / deep links
      - name: Copy index.html as 404.html
        run: cp ./dist/index.html ./dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "./dist"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
